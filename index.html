<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cronômetro</title>
</head>
<body>
    <header>
        <h1>Cronômetro</h1>
    </header>
    <main>
        <section class="chrono">
            <div class="hours">
                <p id="hours">00</p>
            </div>
            <div class="two-points">
                <p>:</p>
            </div>
            <div class="minutes">
                <p id="minutes">00</p>
            </div>
            <div class="two-points">
                <p>:</p>
            </div>
            <div class="seconds">
                <p id="seconds">00</p>
            </div>
        </section>
        <section>
            <div class="button">
                <button class="start">Iniciar</button>
                <button class="pause">Pausar</button>
                <button class="reset">Zerar</button>
            </div>
        </section>
    </main>
</body>
<script src="./script.js"></script>
</html>
